services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mini_siem
      POSTGRES_USER: siem
      POSTGRES_PASSWORD: siem
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siem -d mini_siem"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://siem:siem@db:5432/mini_siem
      JWT_SECRET_KEY: change-me-for-local-dev
      CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
      AUTO_CREATE_TABLES: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000/api
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:

